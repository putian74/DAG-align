[package]
name = "pre-ad-prep"
version = "0.1.0"
edition = "2024"
description = "Preprocessing bridge from DAG graph artifacts to AD-PHMM-align tensor training inputs."
license = "MIT"

[lib]
name = "pre_ad_prep"
path = "src/lib.rs"

[[bin]]
name = "pre-ad-prep"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
