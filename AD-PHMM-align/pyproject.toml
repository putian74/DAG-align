[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-phmm-align"
version = "0.1.0"
description = "Automatic-differentiation PHMM alignment on DAGs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
ad-phmm-align = "ad_phmm_align.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ad_phmm_align = ["py.typed"]

